<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Editar Cliente - Soluinsect</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Editar Cliente</h1>

        <p>Altere os dados do cliente abaixo.</p>

        <form action="/editar-cliente/{{ cliente['id'] }}" method="POST">

            <label for="nome">Nome:</label>

            <input
                type="text"
                id="nome"
                name="nome"
                value="{{ cliente['nome'] }}"
                required
            >

            <br><br>

            <label for="telefone">Telefone:</label>

            <input
                type="text"
                id="telefone"
                name="telefone"
                value="{{ cliente['telefone'] }}"
            >

            <br><br>

            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ cliente['email'] }}"
            >

            <br><br>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

        <br>

        <a href="/lista-clientes">
            <button>Voltar para Clientes</button>
        </a>

    </div>

</body>

</html>
